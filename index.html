<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة محل الحلويات</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7a2e10">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fbf6f1;--card:#fff;--tx:#2b2220;--mut:#7a6a64;--pri:#c2410c;--bd:#eadfd6;--ok:#15803d;--bad:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1614;--card:#2a211e;--tx:#f5ece6;--mut:#b5a39b;--pri:#fb923c;--bd:#40332e;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1614;--card:#2a211e;--tx:#f5ece6;--mut:#b5a39b;--pri:#fb923c;--bd:#40332e;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5;padding-bottom:70px}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:0}.hd{display:flex;align-items:center;gap:12px;margin:6px 0 14px}.hd .lg{width:56px;height:56px}#splash{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .5s}#splash .lg{width:200px;max-width:60%;animation:pop .8s ease}#splash.off{opacity:0;pointer-events:none}.lock .lg{display:block;width:120px;margin:0 auto 10px}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.row{display:flex;gap:8px}.row>*{flex:1}
.line{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--bd)}.line:last-child{border:0}
.tot{font-size:17px;font-weight:700}
.pos{color:var(--ok)}.neg{color:var(--bad)}
button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:11px 14px;width:100%;font-weight:600;margin-top:10px}
.sm{background:none;border:1px solid var(--bd);color:var(--bad);border-radius:8px;padding:2px 8px}
.chip{padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-weight:600}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.days{display:flex;flex-wrap:wrap;gap:6px}.days .chip{padding:8px 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:14px 4px;color:var(--mut);font-weight:600}
nav button.on{color:var(--pri);border-top:3px solid var(--pri);margin-top:-1px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px;text-align:center;border-bottom:1px solid var(--bd)}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
@media print{:root:not([data-theme="none"]){--bg:#fff;--card:#fff;--tx:#000;--mut:#444;--bd:#ccc;color-scheme:light}nav,.noprint{display:none!important}body{padding-bottom:0}.card{break-inside:avoid}input{border:0;background:none}}
</style>
</head>
